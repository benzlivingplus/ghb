<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>เรทผ่อน บ้านคนละหลัง PLUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #7a1f2b;
    --head-bg: #f3dfe2;
    --head-text: #7a1f2b;
    --bg: #f6f1f2;
    --card: #ffffff;
    --line: #ead6d9;
    --line-strong: #d9b8bd;
    --text: #2a1a1d;
    --muted: #7b6a6d;
    --input: #7a1f2b;
  }
  :root[data-theme="dark"] {
    --brand: #c9586a;
    --head-bg: #3a1a20;
    --head-text: #f0a7b3;
    --bg: #120a0c;
    --card: #1e1316;
    --line: #3a252a;
    --line-strong: #553840;
    --text: #f3e9eb;
    --muted: #b49ca1;
    --input: #f0a7b3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #c9586a;
      --head-bg: #3a1a20;
      --head-text: #f0a7b3;
      --bg: #120a0c;
      --card: #1e1316;
      --line: #3a252a;
      --line-strong: #553840;
      --text: #f3e9eb;
      --muted: #b49ca1;
      --input: #f0a7b3;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif; line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh; min-height: 100dvh;
  }
  .calc-wrap {
    max-width: 420px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .topbar .brand { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--brand); }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--brand); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .theme-btn svg { width: 20px; height: 20px; }
  .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: block; }
  :root[data-theme="dark"] .theme-btn .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
    :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
  }
  .card {
    background: var(--card); border: 1px solid var(--line-strong);
    border-radius: 14px; overflow: hidden;
  }
  .card-header { background: var(--head-bg); padding: 13px 16px; text-align: center; }
  .card-title { font-size: 16px; font-weight: 600; color: var(--head-text); line-height: 1.4; }
  .inputs-row { display: grid; grid-template-columns: 0.8fr 1.2fr; border-bottom: 1px solid var(--line); }
  .input-block { padding: 11px 16px; cursor: text; }
  .input-block:first-child { border-right: 1px solid var(--line); }
  .input-label { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .input-block input {
    width: 100%; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 21px; font-weight: 600; color: var(--input);
    padding: 0 0 2px; border-bottom: 1.5px dashed var(--line-strong); border-radius: 0;
  }
  .input-block input:focus { border-bottom: 1.5px solid var(--brand); }
  .error { color: #d13a4f; font-size: 13px; margin-top: 4px; display: none; }
  .error.show { display: block; }
  .rate-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  .rate-row:last-child { border-bottom: none; }
  .rate-label { font-size: 15px; color: var(--text); }
  .rate-sublabel { font-size: 13px; color: var(--muted); }
  .rate-amount { font-size: 18px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 4px 0; text-align: center; }
</style>
</head>
<body>
<div class="calc-wrap">
  <div class="topbar">
    <span class="brand">THE LIVING PLUS</span>
    <button class="theme-btn" id="themeBtn" aria-label="สลับธีมกลางวัน/กลางคืน">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="card" id="card1">
    <div class="card-header">
      <div class="card-title">คำนวนเรทผ่อน โปร บ้านคนละหลัง PLUS</div>
    </div>
    <div class="inputs-row">
      <label class="input-block">
        <div class="input-label">ระยะเวลาผ่อน (ปี)</div>
        <input type="text" id="years1" value="40" inputmode="numeric" autocomplete="off" />
        <div class="error" id="yearsErr">1–40 ปี</div>
      </label>
      <label class="input-block">
        <div class="input-label">วงเงินกู้ (บาท)</div>
        <input type="text" id="amount1" value="1,000,000" inputmode="numeric" autocomplete="off" />
        <div class="error" id="amountErr">กรอกวงเงิน</div>
      </label>
    </div>
    <div id="rows"></div>
  </div>

  <p class="note">* ตัวเลขโดยประมาณ ค่างวดจริงขึ้นกับการอนุมัติของ ธอส.</p>
</div>

<script>
/*
  ตารางโปร "บ้านคนละหลัง PLUS (ผ่อนปรนเกณฑ์รายได้) (PSA)"
  label/sub  = อัตราที่แสดงตามประกาศธนาคาร
  calcRate   = อัตราที่ใช้คำนวณค่างวด (ธนาคารคิดค่างวดสูงกว่าอัตราประกาศในบางช่วง)
  ปรับจากหน้าจอระบบ ธอส. (1,000,000 และ 2,000,000 บาท ที่ 40 ปี ตรงครบทุกช่วง)
  ระยะเวลาอื่นใช้สูตรเดียวกัน (โครงสร้างเดียวกับโปรสุขใจ) — ยังไม่ได้ยืนยันกับระบบธนาคาร
  ถ้าได้ตัวเลขจริงเพิ่ม ให้แก้ calcRate ตรงนี้ที่เดียว
*/
const TIERS = [
  { label: 'ปีที่ 1–2 : 2.8%',                    calcRate: 0.030 },
  { label: 'ปีที่ 3 : 3.5%',                      calcRate: 0.035 },
  { label: 'ปีที่ 4–5 : 4%',                      calcRate: 0.040 },
  { label: 'ปีที่ 6–7 : MRR–2.00 (4.145%)',       calcRate: 0.050 },
  { label: 'ปีที่ 8 เป็นต้นไป : MRR–0.7500', sub: '(5.395%)', calcRate: 0.061 },
];

function pmt(annualRate, years, principal) {
  const r = annualRate / 12, n = years * 12;
  const f = Math.pow(1 + r, n);
  return principal * r * f / (f - 1);
}
const installment = (t, y, a) => Math.ceil(pmt(t.calcRate, y, a) / 100) * 100;
const fmt = n => n.toLocaleString('th-TH');
const $ = id => document.getElementById(id);
const num = el => { const v = parseInt(el.value.replace(/[^\d]/g, ''), 10); return isNaN(v) ? 0 : v; };

function update() {
  const years = num($('years1')), amount = num($('amount1'));
  const okY = years >= 1 && years <= 40, okA = amount > 0;
  $('yearsErr').classList.toggle('show', !okY);
  $('amountErr').classList.toggle('show', !okA);
  $('rows').innerHTML = TIERS.map(t =>
    '<div class="rate-row"><div><div class="rate-label">' + t.label + '</div>' +
    (t.sub ? '<div class="rate-sublabel">' + t.sub + '</div>' : '') +
    '</div><div class="rate-amount">' + (okY && okA ? fmt(installment(t, years, amount)) : '–') + '</div></div>'
  ).join('');
}

// วงเงิน: ใส่ comma อัตโนมัติ โดยรักษาตำแหน่ง cursor
$('amount1').addEventListener('input', e => {
  const el = e.target;
  const digitsBefore = el.value.slice(0, el.selectionStart).replace(/[^\d]/g, '').length;
  const raw = el.value.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  el.value = raw ? fmt(parseInt(raw, 10)) : '';
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  el.setSelectionRange(pos, pos);
  update();
});
$('years1').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 2); update(); });
['years1', 'amount1'].forEach(id => $(id).addEventListener('focus', e => setTimeout(() => e.target.select(), 0)));

// ธีมกลางวัน/กลางคืน (จำค่าไว้ในเครื่อง)
try { const s = localStorage.getItem('ghb-theme'); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme ||
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('ghb-theme', next); } catch (e) {}
});

update();
</script>
</body>
</html>
